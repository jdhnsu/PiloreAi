<!doctype html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>PiLore · AI 学习助手</title>
	<link rel="stylesheet" href="/style.css">
</head>
<body>
	<div class="app">
		<header class="topbar">
			<div class="brand">
				<img class="logo" src="/assets/2d/pilore_face_smile.png" alt="PiLore">
				<div>
					<h1 class="wordmark"><span class="wm-pi">Pi</span>Lore</h1>
					<p class="subtitle" id="greeting">今天想学点什么？</p>
				</div>
			</div>
			<div class="topbar-right">
				<div class="pack-menu">
					<button id="pack-select" class="pack-select" type="button" aria-haspopup="listbox" aria-expanded="false">
						<span class="pack-select-label">学习包</span>
						<strong id="pack-current"></strong>
						<span class="pack-chevron" aria-hidden="true"></span>
					</button>
					<div id="pack-options" class="pack-options hidden" role="listbox" aria-label="切换学习包"></div>
				</div>
				<button id="ss-mobile-toggle" class="icon-btn ss-mobile-only" type="button" title="会话历史" aria-label="打开会话历史" aria-expanded="false">☰</button>
				<span id="demo-badge" class="demo-badge hidden">演示</span>
				<span id="persona-badge" class="persona-badge hidden"></span>
				<span class="topbar-sep" aria-hidden="true"></span>
				<span id="model-info" class="model-info" title=""><span class="model-dot"></span><span id="model-name"></span></span>
				<button id="ws-mobile-toggle" class="icon-btn ws-mobile-only" type="button" title="工作区" aria-label="打开工作区" aria-expanded="false">▤</button>
			</div>
		</header>

		<main class="layout">
			<nav class="sessions card" id="sessions-panel" aria-label="会话历史">
				<div id="ss-resize" class="ss-resize" role="separator" aria-orientation="vertical" tabindex="0"
					aria-label="侧边栏宽度（左右方向键调整，Enter 收起，Home 复位）" aria-valuemin="180" aria-valuenow="240" title="拖动调整宽度，双击复位"></div>
				<div class="ss-head">
					<h2>会话</h2>
					<button id="ss-toggle" class="icon-btn" title="收起会话历史" aria-controls="sessions-panel" aria-expanded="true">«</button>
				</div>
				<button id="ss-new" class="ss-new" type="button">＋ 新建会话</button>
				<ul id="session-list" class="session-list"></ul>
				<div class="ss-foot">
					<span id="storage-badge" class="storage-badge" title=""></span>
				</div>
				<button id="ss-rail" class="ss-rail" title="展开会话历史" aria-controls="sessions-panel" aria-expanded="false">
					<span class="ss-rail-icon">»</span>
					<span class="ss-rail-text">会话</span>
				</button>
			</nav>

			<section class="chat">
				<div id="messages" class="messages">
					<div class="welcome card">
						<h2 id="welcome-title">开始学习</h2>
						<p id="welcome-desc">向 PiLore 提问，它会自动选择合适的教学方法；也可以用 @ 直接指定老师。</p>
						<div id="suggestions" class="suggestions"></div>
					</div>
				</div>

				<div class="composer card" id="composer">
					<div class="composer-toolbar">
						<span class="chips-label">指定老师：</span>
						<div id="chips" class="chips"></div>
						<button class="chip chip-reset hidden" id="reset-persona">↩ 切回 PiLore</button>
					</div>
					<div class="composer-input">
						<textarea id="input" rows="2" placeholder="向 PiLore 提问…"></textarea>
						<span class="resize-grip" role="separator" aria-orientation="horizontal" tabindex="0"
							aria-label="输入框高度（上下方向键调整，Home 恢复自动增高）" aria-valuenow="66" title="拖动调整高度，双击复位"></span>
					</div>
					<div class="composer-footer">
						<span id="persona-hint" class="persona-hint hidden"></span>
						<span class="composer-hint"><kbd>Enter</kbd> 发送 · <kbd>Shift</kbd>+<kbd>Enter</kbd> 换行</span>
						<div class="composer-actions">
							<button id="send" class="btn-primary" disabled>发送</button>
							<button id="abort" class="btn-danger hidden">停止</button>
						</div>
					</div>
				</div>
			</section>

			<aside class="workspace card" id="workspace-panel">
				<div id="ws-resize" class="ws-resize" role="separator" aria-orientation="vertical" tabindex="0"
					aria-label="工作区宽度（左右方向键调整，Enter 收起，Home 复位）" aria-valuemin="220" aria-valuenow="300" title="拖动调整宽度，双击复位"></div>
				<div class="ws-head">
					<h2 id="ws-title">工作区</h2>
					<button id="ws-toggle" class="icon-btn" title="收起工作区" aria-controls="workspace-panel" aria-expanded="true">»</button>
				</div>
				<ul id="file-list" class="file-list">
					<li class="empty">暂无文件</li>
				</ul>
				<button id="ws-expand" class="ws-rail" title="展开工作区" aria-controls="workspace-panel" aria-expanded="false">
					<span class="ws-rail-icon">«</span>
					<span class="ws-rail-text">工作区</span>
				</button>
			</aside>
		</main>
	</div>

	<div id="ss-backdrop" class="panel-backdrop" aria-hidden="true"></div>
	<div id="ws-backdrop" class="panel-backdrop" aria-hidden="true"></div>

	<div id="code-modal" class="modal hidden">
		<div class="modal-backdrop"></div>
		<div class="modal-panel card">
			<div class="modal-head">
				<span id="modal-title" class="modal-title"></span>
				<span id="modal-index" class="modal-index"></span>
				<div class="modal-actions">
					<button id="modal-prev" class="icon-btn" title="上一个文件（←）">‹</button>
					<button id="modal-next" class="icon-btn" title="下一个文件（→）">›</button>
					<button id="modal-copy" class="copy-btn" type="button">复制</button>
					<button id="modal-fullscreen" class="copy-btn" type="button">全屏</button>
					<button id="modal-close" class="icon-btn" title="关闭（Esc）">✕</button>
				</div>
			</div>
			<pre class="modal-body"><code id="modal-code"></code></pre>
		</div>
	</div>

	<script src="/app.js"></script>
</body>
</html>
